name: ARM64 Windows routing

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  host-independent-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Test ARM64 Windows routing
        run: python contrib/test_arm64_windows_routing.py
      - name: Test deterministic source archive
        run: python contrib/test_gcc_source_archive.py
      - name: Test fail-closed testsuite accounting
        run: python contrib/test_arm64_windows_testsuite_gate.py
